<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <span class="footer-prompt">~ $</span>
      <span>保持好奇，持续学习。</span>
    </div>
    <div class="footer-right">
      {% if site.social.github %}<a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.social.rss %}<a href="{{ site.social.rss | relative_url }}">RSS</a>{% endif %}
      <span class="footer-copy">© {{ site.time | date: "%Y" }} {{ site.author.name | default: 'xysjb1-create' }}</span>
    </div>
  </div>
  <div class="container footer-bottom">
    <span>Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a> · Hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></span>
  </div>
</footer>
